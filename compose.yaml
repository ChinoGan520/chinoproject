services:
  web:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/chino.sqlite3
      DEMO_MODE: "false"
    volumes:
      - chino-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/bootstrap', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
volumes:
  chino-data:
